{% extends "base.html" %}
{% block title %}{{ 'Edit member' if editing else 'Add member' }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ 'Edit member' if editing else 'Add member' }}</h1></div>

<form class="form" method="post">
  <label>Full name
    <input name="name" value="{{ member.name }}" required maxlength="120" autofocus>
  </label>
  <div class="row">
    <label>Email
      <input name="email" type="email" value="{{ member.email }}" required maxlength="120">
    </label>
    <label>Phone
      <input name="phone" value="{{ member.phone or '' }}" maxlength="20">
    </label>
  </div>
  <label>Member type
    <select name="member_type">
      {% for t in types %}<option {% if member.member_type == t %}selected{% endif %}>{{ t }}</option>{% endfor %}
    </select>
  </label>
  <div class="form-actions">
    <button class="btn primary">{{ 'Save changes' if editing else 'Add member' }}</button>
    <a href="{{ url_for('members') }}">Cancel</a>
  </div>
</form>
{% endblock %}
