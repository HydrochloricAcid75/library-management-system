<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} – Library Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="shell">
  <header class="side">
    <a class="brand" href="{{ url_for('index') }}">Library Desk</a>
    <nav aria-label="Main">
      {% set path = request.path %}
      <a href="{{ url_for('index') }}"   {% if path == '/' %}class="on" aria-current="page"{% endif %}>Dashboard</a>
      <a href="{{ url_for('books') }}"   {% if path.startswith('/books') %}class="on" aria-current="page"{% endif %}>Books</a>
      <a href="{{ url_for('members') }}" {% if path.startswith('/members') %}class="on" aria-current="page"{% endif %}>Members</a>
      <a href="{{ url_for('issues') }}"  {% if path.startswith('/issues') %}class="on" aria-current="page"{% endif %}>Issue &amp; return</a>
    </nav>
  </header>

  <main class="main">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="flash {{ cat }}" role="status">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
